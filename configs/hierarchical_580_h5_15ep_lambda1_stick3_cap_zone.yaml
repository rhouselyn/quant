extreme_frac: 0.2
ema_decay: 0.99
group_weight: 0.0
group_warmup_epochs: 0
provider: yahoo
cache_path: data/sw_580_observed_features/weekly.parquet
output_dir: outputs
score_top_weight: 1.0
score_bottom_weight: 1.0
selection_metric: long_net_sharpe
long_top_n: 20
save_epoch_checkpoints: false
screened_universe: true
universe_name: Shenwan 29 industries x original 20 random eligible stocks
universe_path: data/sw_580_observed_features/universe.csv
industry_classification: Shenwan level 1 (current snapshot, retrospective)
prepare_command: python scripts/prepare_hierarchy_580.py
encoder_chunk_size: 580
model_type: hierarchical_market
market_path: data/sw_580_observed_features/market_features.csv
attention_heads: 4
global_layers: 2
market_tokens: 1
market_features: 6
relation_gate_init: 0.0
dropout: 0.1
eval_batch_dates: 4
min_history_weeks: 32
common_training_horizon: 5
torch_num_threads: 4
freeze_relation_gates: true
# Penalise the share of weekly score variance explained by industry means (eta squared).
industry_exposure_weight: 1.0

# Penalise the softmax-L1 movement of the weekly score profile vs last week:
# the differentiable stand-in for the no-trade band that the sweep priced at +10.6bps/wk.
turnover_control_weight: 3.0
control_temperature_mult: 0.5
# Bill only the flow of the traded book: project the score onto {0<=w<=1/20, sum w=1}
# instead of the whole-cross-section Gibbs measure (corr with real churn .90 vs .55).
control_measure: capped
# Hinge version of the same control: flow inside the no-trade region is free and
# only the excess is billed. delta = 0.25 of the book = 5 of 20 names per week,
# just below where the score-space band settled (churn 0.285).
control_dead_zone: 0.25
