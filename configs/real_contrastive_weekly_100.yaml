seed: 42
n_stocks: 100
# Number of Friday-ending bars retained after daily-to-weekly aggregation.
n_days: 520
frequency: weekly
lookback: 40
context_lengths: [20, 40, 60]
n_features: 24
d_model: 96
n_layers: 4
embedding_dim: 128
group_size: 8
batch_size: 16
epochs: 5
learning_rate: 0.0008
weight_decay: 0.00001
# Chronological split in weekly rows: 70% train, 15% validation, 15% test.
train_end: 364
valid_end: 442
transaction_cost_bps: 10

# Temporal InfoNCE plus extreme cross-sectional score objectives.
score_weight: 1.0
temporal_weight: 1.0
rankic_weight: 0.5
rankic_temperature: 0.05
# Coarse return-quartile ranking; names inside one quartile are not compared.
block_rank_weight: 0.5
block_rank_blocks: 4
block_rank_temperature: 0.1
score_temperature: 1.0
temperature: 0.1
temporal_horizon: 5
temporal_horizons: [1, 3, 5]
extreme_frac: 0.2
ema_decay: 0.99
group_weight: 0.001
group_warmup_epochs: 2

provider: baostock
cache_path: data/real_100_520_weekly.parquet
output_dir: outputs
