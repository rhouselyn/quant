seed: 42
n_stocks: 20
n_days: 1000
lookback: 40
n_features: 24
d_model: 96
n_layers: 4
embedding_dim: 128
group_size: 8
batch_size: 64
epochs: 3
learning_rate: 0.0008
weight_decay: 0.00001
train_end: 680
valid_end: 840
transaction_cost_bps: 10

# The two active objectives requested for this experiment.
score_weight: 1.0
temporal_weight: 0.2
score_temperature: 1.0
temperature: 0.1
temporal_horizon: 5
extreme_frac: 0.2
ema_decay: 0.99

# Optional representation regulariser; zero keeps this run to the two losses.
group_weight: 0.0

provider: baostock
cache_path: data/real_20_1000.parquet
output_dir: outputs
